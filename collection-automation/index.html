<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Koleksiyon Otomasyonu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    
<div class="container">

<h2>Koleksiyon Listesi</h2>

<div class="form">
    <input type="text" id="koleksiyonInput" placeholder="Öğe adı girin">
    <input type="text" id="kategoriInput" placeholder="Kategori">
    <button id="ekleBtn">Öğe Ekle</button>
</div>

<div class="search">
    <input type="text" id="searchInput" placeholder="Öğe ara...">
</div>

<ul id="koleksiyonListesi"></ul>

<div class="pagination">
    <button id="prevBtn">Önceki</button>
    <span id="sayfaBilgi"></span>
    <button id="nextBtn">Sonraki</button>
</div>

<script src="script.js"></script>
</div>

</body>
</html>
